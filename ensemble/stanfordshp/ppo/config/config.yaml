# increasing PPO Training Configuration with EFS Logging
# ===================================================

# Model Configuration
model_name: "Qwen/Qwen2-0.5B"

# Dataset Configuration
dataset:
  name: "stanfordnlp/SHP"
  split: "train"
  max_samples: null
  max_length: 1024
  max_prompt_length: 256
  max_response_length: 128
  split_seed: 42
  dataset_dir: dataset/stanfordshp

# PPO Configuration
ppo:
  init_kl_coef: 0.5
  target_kl: 6
  mini_batch_size: 8

# Training Configuration
training:
  learning_rate: 1e-6
  batch_size: 64
  num_epochs: 2
  logging_steps: 10
  runs: 5

# Checkpoints Configuration
checkpoints:
  dir: "models/ensemble/stanfordshp/ppo/checkpoints/ppo_increasing"
  save_steps: 1000
  save_total_limit: 1

# Logging Configuration
logging:
  dir: "logs/ensemble/stanfordshp/ppo/ppo_increasing"
  sample_batch_size: 16
  sample_save_every: 20

# MLflow Configuration
mlflow:
  enabled: false

# Wandb Configuration
wandb:
  enabled: false

# Bootstrap ensemble curriculum configuration
bootstrap_ensemble:
  enabled: true
  m: 2
  gamma: 0.0
  base_model_name: "stanfordnlp/SteamSHP-flan-t5-large"
  shard_seed: 42
  reuse_cache: true
  # optional; defaults to <logging.dir>/bootstrap_ensemble_cache if omitted
  cache_dir: "/efs/rohandeb/logs/ensemble/qwen/stanfordnlp-SHP/ppo/bootstrap_ensemble_cache"

  rm_train:
    learning_rate: 1e-5
    batch_size: 16
    epochs: 1
    max_length: 1024
    grad_accum_steps: 1
    max_steps: null

  scoring:
    batch_size: 32
    max_length: 1024
