# PPO + Bootstrap-Ensemble Curriculum (with disk-cache fallback to HF)

model_name: "Qwen/Qwen2-0.5B"

dataset:
  name: "Anthropic/hh-rlhf"
  split: "train"
  dataset_dir: dataset/hh-rlhf
  max_samples: null
  max_prompt_length: 256
  max_response_length: 128
  split_seed: 42

ppo:
  init_kl_coef: 0.5
  target_kl: 6
  mini_batch_size: 4

training:
  learning_rate: 1e-6
  batch_size: 8
  num_epochs: 2
  logging_steps: 10

checkpoints:
  dir: "models/ensemble/hh-rlhf/ppo/checkpoints/ppo_increasing"

logging:
  dir: "logs/ensemble/hh-rlhf/ppo/ppo_increasing"

mlflow:
  enabled: false

wandb:
  enabled: false

bootstrap_ensemble:
  enabled: true
  m: 2
  gamma: 0.0
  shard_seed: 42
  cache_dir: "/efs/rohandeb/logs/ensemble/qwen/hh-rlhf/ppo/ppo_ensemble/bootstrap_ensemble_cache"
  reuse_cache: true

  rm_train:
    learning_rate: 1e-5
    batch_size: 16
    epochs: 1
    max_length: 1024
    grad_accum_steps: 1
    max_steps: null

  scoring:
    batch_size: 32
    max_length: 1024
