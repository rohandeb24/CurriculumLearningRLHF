
# Standard PPO Training Configuration with EFS Logging
# ===================================================

# Model Configuration
model_name: "Qwen/Qwen2-0.5B"

# Dataset Configuration
dataset:
  name: "Anthropic/hh-rlhf"
  split: "train"
  max_samples: null  # Set to a number to limit dataset size for testing
  max_length: 1024
  max_prompt_length: 256
  max_response_length: 128
  split_seed: 42
  dataset_dir: dataset/hh-rlhf

# PPO Configuration
ppo:
  init_kl_coef: 0.5
  target_kl: 6
  mini_batch_size: 4

# Training Configuration
training:
  learning_rate: 1e-6 # [1e-4, 1e-5, 1e-6]
  batch_size: 8 #[4,8,16]
  num_epochs: 2 # [1,2,4]
  logging_steps: 10


# Checkpoints Configuration
checkpoints:
  dir: "models/baseline_tuning/hh-rlhf/ppo/checkpoints"
  save_steps: 1000
  save_total_limit: 1

# Logging Configuration
logging:
  dir: "logs/baseline_tuning/hh-rlhf/ppo"
  sample_batch_size: 16
  sample_save_every: 20

# MLflow Configuration
mlflow:
  enabled: false

# Wandb Configuration
wandb:
  enabled: false
