
# increasing PPO Training Configuration with EFS Logging
# ===================================================

# Model Configuration
model_name: "Qwen/Qwen2-0.5B"

# Dataset Configuration
dataset:
  name: "stanfordnlp/SHP"
  split: "test"
  max_samples: 1000  # Set to a number to limit dataset size for testing
  max_length: 1024
  max_prompt_length: 256
  max_response_length: 128
  split_seed: 42
  dataset_dir: dataset/stanfordshp

# PPO Configuration
ppo:
  init_kl_coef: 0.5
  target_kl: 6
  mini_batch_size: 4

cluster:
  n_clusters: 20
  emb_batch: 1024
  emb_model: "sentence-transformers/all-mpnet-base-v2"


# Val Configuration
training:
  batch_size: 64
  learning_rate: 1e-6
  num_epochs: 3
  logging_steps: 10


# Checkpoints Configuration
checkpoints:
  dir_standard: "models/pec/stanfordshp/ppo/llmevaluate/standard"
  dir_curr: "models/pec/stanfordshp/ppo/llmevaluate/curr"
  save_dir: "models/pec/stanfordshp/ppo/llmevaluate/comparison"
  save_steps: 100
  save_total_limit: 1

# Logging Configuration
logging:
  dir: "logs/pec/stanfordshp/ppo/llmevaluate"
  sample_batch_size: 2
  sample_save_every: 20

# MLflow Configuration
mlflow:
  enabled: false

# Wandb Configuration
wandb:
  enabled: false
